services:
  - type: web
    name: csc325djangoproj
    runtime: python
    plan: free
    # GitHub Actions deploys after the Test stage passes, so Render must not
    # deploy on its own when commits land on main.
    autoDeploy: false
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate
    startCommand: gunicorn csc325djangoproj.wsgi:application
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: SECRET_KEY
        generateValue: true
