name: CSC325 CI/CD

# Trigger: every push to main runs all four stages.
# Pull requests into main run Setup, Dependencies and Test only.
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # Stage 1: check out the code and install Python
  setup:
    name: Setup
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Show Python version
        run: python --version

  # Stage 2: install the packages from requirements.txt
  dependencies:
    name: Dependencies
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check installed packages
        run: |
          pip check
          pip list

  # Stage 3: run the full test suite; any failing test fails the pipeline
  test:
    name: Test
    needs: dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Django checks
        run: python manage.py check

      - name: Run tests
        run: python manage.py test --verbosity 2

  # Stage 4: deploy to Render, only after Test passes and only from main
  deploy:
    name: Deploy
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - name: Trigger Render deploy
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "::error::The RENDER_DEPLOY_HOOK_URL repository secret is not set."
            exit 1
          fi
          echo "Deploying commit $GITHUB_SHA to Render..."
          curl --fail --silent --show-error -X POST "$RENDER_DEPLOY_HOOK_URL&ref=$GITHUB_SHA"
          echo
          echo "Render accepted the deploy."
